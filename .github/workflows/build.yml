name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: PerlerBeadsDesigner-windows
          - os: macos-latest
            asset_name: PerlerBeadsDesigner-macos
          - os: ubuntu-latest
            asset_name: PerlerBeadsDesigner-linux

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      run: pyinstaller pyinstaller.spec --noconfirm

    - name: Package (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"
        Compress-Archive -Path "dist/PerlerBeadsDesigner" `
          -DestinationPath "${{ matrix.asset_name }}-$tag.zip" -Force

    - name: Package (macOS/Linux)
      if: runner.os != 'Windows'
      run: |
        tag="${{ github.ref_name }}"
        chmod +x "dist/PerlerBeadsDesigner/PerlerBeadsDesigner-bin" || true
        tar -C dist -czf "${{ matrix.asset_name }}-${tag}.tar.gz" PerlerBeadsDesigner

    - name: Upload Release Asset (Windows)
      if: runner.os == 'Windows'
      uses: softprops/action-gh-release@v2
      with:
        files: "${{ matrix.asset_name }}-${{ github.ref_name }}.zip"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Release Asset (macOS/Linux)
      if: runner.os != 'Windows'
      uses: softprops/action-gh-release@v2
      with:
        files: "${{ matrix.asset_name }}-${{ github.ref_name }}.tar.gz"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Android APK（Flutter）：与桌面三平台同一 Release，供手机端在线更新下载
  build-android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.8'
        channel: 'stable'
        cache: true

    - name: Build APK
      working-directory: perler_app
      run: |
        flutter pub get
        flutter build apk --debug

    - name: Rename APK with tag
      run: |
        tag="${{ github.ref_name }}"
        cp "perler_app/build/app/outputs/flutter-apk/app-debug.apk" "PerlerBeadsDesigner-android-${tag}.apk"

    - name: Upload Release Asset (Android)
      uses: softprops/action-gh-release@v2
      with:
        files: "PerlerBeadsDesigner-android-${{ github.ref_name }}.apk"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
