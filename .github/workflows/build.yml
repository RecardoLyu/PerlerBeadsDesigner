name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: PerlerBeadsDesigner-windows
          - os: macos-latest
            asset_name: PerlerBeadsDesigner-macos
          - os: ubuntu-latest
            asset_name: PerlerBeadsDesigner-linux

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      run: pyinstaller pyinstaller.spec --noconfirm

    - name: Package (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"
        Compress-Archive -Path "dist/PerlerBeadsDesigner" `
          -DestinationPath "${{ matrix.asset_name }}-$tag.zip" -Force

    - name: Package (macOS/Linux)
      if: runner.os != 'Windows'
      run: |
        tag="${{ github.ref_name }}"
        chmod +x "dist/PerlerBeadsDesigner/PerlerBeadsDesigner-bin" || true
        tar -C dist -czf "${{ matrix.asset_name }}-${tag}.tar.gz" PerlerBeadsDesigner

    - name: Upload Release Asset (Windows)
      if: runner.os == 'Windows'
      uses: softprops/action-gh-release@v2
      with:
        files: "${{ matrix.asset_name }}-${{ github.ref_name }}.zip"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Release Asset (macOS/Linux)
      if: runner.os != 'Windows'
      uses: softprops/action-gh-release@v2
      with:
        files: "${{ matrix.asset_name }}-${{ github.ref_name }}.tar.gz"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Android APK（Flutter）：与桌面三平台同一 Release，供手机端在线更新下载
  build-android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.8'
        channel: 'stable'
        cache: true

    - name: Decode release keystore
      # 从 Secrets 还原正式 keystore（base64）→ app/perler-release.keystore。
      # tr 剥离任何残留空白/换行（secret 可能带尾换行导致 base64 -d 报 invalid input）。
      working-directory: perler_app/android/app
      run: |
        echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | tr -d '[:space:]' | base64 -d > perler-release.keystore
        SIZE=$(stat -c%s perler-release.keystore)
        echo "keystore decoded: $SIZE bytes"
        # 解码产物必须是非空的合法 keystore（PKCS12/JKS 头）；太小即解码失败，立即报错
        if [ "$SIZE" -lt 1000 ]; then
          echo "::error::keystore 解码失败（仅 $SIZE 字节），请检查 ANDROID_KEYSTORE_BASE64 secret"
          exit 1
        fi

    - name: Create key.properties
      # 生成 key.properties 供 build.gradle.kts 读取正式签名（与本地一致 → 在线更新可覆盖安装）
      working-directory: perler_app/android
      run: |
        {
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
          echo "storeFile=perler-release.keystore"
        } > key.properties

    - name: Build APK
      working-directory: perler_app
      run: |
        flutter pub get
        flutter build apk --release

    - name: Rename APK with tag
      run: |
        tag="${{ github.ref_name }}"
        cp "perler_app/build/app/outputs/flutter-apk/app-release.apk" "PerlerBeadsDesigner-android-${tag}.apk"

    - name: Upload Release Asset (Android)
      uses: softprops/action-gh-release@v2
      with:
        files: "PerlerBeadsDesigner-android-${{ github.ref_name }}.apk"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
