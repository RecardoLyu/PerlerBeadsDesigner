name: perler_app
description: 拼豆图纸生成器 · 安卓移动版（Flutter + opencv_dart）
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # 状态管理
  flutter_riverpod: ^2.5.1
  # OpenCV（FFI 绑定，自动带各 ABI 原生库）
  opencv_dart: ^1.3.0
  # 相册/文件选图
  image_picker: ^1.1.2
  file_picker: ^8.0.0
  # 图像编解码（UI 显示）
  image: ^4.2.0
  # 权限
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/palette/
